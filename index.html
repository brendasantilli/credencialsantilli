<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración del viewport vital para el diseño responsive (30 pts en CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital | [Tu Nombre]</title>
    <!-- Enlace al archivo CSS externo mediante ruta relativa -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Contenedor principal que agrupa todo -->
    <main class="contenedor-principal">
        
        <!-- Tarjeta/Afiche en sí mismo -->
        <article class="credencial">
            
            <!-- Encabezado con imagen y título principal -->
            <header class="credencial-header">
                <img src="img/avatar.jpg" alt="Ilustración de perfil de [Tu Nombre]" class="avatar">
                <h1>Tu Nombre</h1>
            </header>

            <!-- Sección de información descriptiva -->
            <section class="credencial-info">
                <p>Estudiante de diseño y desarrollo web. Buscando siempre la intersección entre la estética y el código.</p>
                <ul>
                    <li><strong>Rol:</strong> Desarrollador Web</li>
                    <li><strong>Intereses:</strong> UI/UX, Tipografía, Arte Digital</li>
                    <li><strong>Frase:</strong> "Menos es más"</li>
                </ul>
            </section>

            <!-- Pie de la tarjeta con el enlace solicitado -->
            <footer class="credencial-footer">
                <!-- Se usa target="_blank" para abrir en otra pestaña -->
                <a href="https://github.com/tu-usuario" class="btn-enlace" target="_blank" rel="noopener noreferrer">
                    Visitar mi Portfolio
                </a>
            </footer>

        </article>

    </main>

</body>
</html>
